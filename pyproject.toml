[project]
name = "procurement-integrity-agent"
version = "0.3.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E731", "B008", "B904", "B905", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"evals/*" = ["E402"]
